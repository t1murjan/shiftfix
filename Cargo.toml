[package]
name = "shiftfix"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "Двойной Shift исправляет раскладку последнего слова или выделения (Linux, evdev + uinput)"
repository = "https://github.com/t1murjan/shiftfix"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "links"] }
egui-phosphor = "0.14"
evdev = "0.13"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.190"
libloading = "0.8"
log = { version = "0.4.34", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4"
toml = "1.1.8"
toml_edit = "0.25"
wayland-client = "0.31"
# Рамка окна с заголовком в GNOME: у mutter нет серверных декораций.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
x11rb = { version = "0.13", features = ["xfixes", "xkb"] }
zbus = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
